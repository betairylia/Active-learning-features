description: Auto-sweep config file generated by wandb_sweeper.py
method: grid
metric:
  goal: maximize
  name: accuracy
parameters:
  aaarunid:
    values:
      - "0"
  blur:
    values:
      - "2.0"
      - "6.0"
  dataset:
    values:
      - imagenet
  dataset_vis:
    values:
      - "0"
  keyargs:
    value: model,net,blur
  model:
    values:
      - default
      - ttuq-complete-posterior
      - ttuq-Ozz
  net:
    values:
      - resnet18-imagenet
      - resnet50-imagenet
      - wide-resnet50-imagenet
  no_train:
    values:
      - "1"
  noise:
    values:
      - "0.0"
  noise_pattern:
    values:
      - indep
  ttuq_delta:
    values:
      - "2.0"
  ttuq_lambda:
    values:
      - "50.0"
  ttuq_scaling:
    values:
      - layerwise
  perturb_power:
    values:
      - "2.0"
      - "1.5"
program: main.py

